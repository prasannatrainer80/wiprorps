<html>
    <head>
        <script>
            function show() {
                var res = "";
                var names = ["Dharma Teja","Mounish","Sakthi","Sripada","Sunil","Hitasree"];
                for(var v in names) {
                    res+=names[v]+"<br/>";
                }
                document.getElementById("result").innerHTML = res;
            }
        </script>
    </head>
<body onload="show()">
    <span id="result"></span>
</body>
</html>
