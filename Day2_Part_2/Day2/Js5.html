<html>
    <head>
        <script>
            function show() {
                var age = frmVoting.age.value;
                if (age < 18) {
                    document.getElementById("result").innerHTML = "You Cannot Vote...".fontcolor("red");
                } else {
                    document.getElementById("result").innerHTML = "You Can Vote...".fontcolor("green");
                }
            }
        </script>
    </head>
<body>
    <form name="frmVoting">
        <center>
            Age : 
            <input type="number" name="age" /> <br/>
            <input type="button" value="Show" onclick="show()" /> <hr/>
            <span id="result"></span>
        </center>
    </form>
</body>
</html>
